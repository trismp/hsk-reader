# Publishes the site/ folder to GitHub Pages on every push to main.
#
# GitHub Actions runs this on GitHub's servers (free for public repos):
#   1. check out the repository
#   2. package site/ as a Pages artifact
#   3. deploy it to https://<user>.github.io/hsk-reader/
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}   # allows a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes does not list the package for a moment after the upload, and the
      # deploy then fails with "No artifacts named github-pages". So wait, and retry once.
      - run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
